# Environnement local : PostgreSQL, object storage S3 (RustFS) et capture d'emails (Mailpit).
# Identifiants de développement uniquement.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cf_owner
      POSTGRES_PASSWORD: cf_owner
      POSTGRES_DB: kodi
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cf_owner -d kodi"]
      interval: 2s
      timeout: 3s
      retries: 30

  s3:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: kodi
      RUSTFS_SECRET_KEY: kodi-dev
    ports: ["9100:9000"]
    volumes: [s3data:/data]

  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["1025:1025", "8025:8025"]

  api:
    build: .
    profiles: [app]
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      APP_ENV: development
      HTTP_ADDR: ":8080"
      APP_BASE_URL: http://localhost:3000
      DATABASE_URL: postgres://cf_app:cf_app@postgres:5432/kodi?sslmode=disable
      MIGRATE_DATABASE_URL: postgres://cf_owner:cf_owner@postgres:5432/kodi?sslmode=disable
      S3_ENDPOINT: http://s3:9000
      S3_ACCESS_KEY: kodi
      S3_SECRET_KEY: kodi-dev
      S3_BUCKET: kodi
      SMTP_ADDR: mailpit:1025
      MAIL_FROM: noreply@kodi.local
    ports: ["8080:8080"]

volumes:
  pgdata:
  s3data:
