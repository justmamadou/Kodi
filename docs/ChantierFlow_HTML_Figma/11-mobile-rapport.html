<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Rapport journalier — ChantierFlow</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&amp;display=swap">
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif;color:#1D1D1F}
*{box-sizing:border-box}
a{color:#2B59E6}
input,select,textarea,button{font:400 16px Inter,system-ui,sans-serif;color:#1D1D1F}
.f{display:flex;flex-direction:column;gap:8px}
.f label,.lg{font-size:14px;font-weight:600}
.inp{height:50px;border:1px solid #D2D2D7;border-radius:12px;padding:0 14px;background:#FFFFFF;width:100%}
textarea.inp{height:96px;padding:12px 14px;resize:none;line-height:1.45}
.req{color:#B3261E}
.box{background:#FFFFFF;border:1px solid #D2D2D7;border-radius:12px;padding:2px 14px}
.row{display:flex;align-items:center;gap:12px;min-height:50px;border-bottom:1px solid #F2F2F7;font-size:15px}
.row:last-child{border-bottom:0}
.chip{height:44px;padding:0 14px;border-radius:999px;border:1px solid #D2D2D7;background:#FFFFFF;font-size:14px;font-weight:600;cursor:pointer}
.chip.on{background:#1D1D1F;border-color:#1D1D1F;color:#FFFFFF}
.btn{display:flex;align-items:center;justify-content:center;height:52px;border-radius:12px;font:600 16px Inter,system-ui,sans-serif;text-decoration:none;border:1px solid transparent;cursor:pointer}
.ph{border-radius:12px;background:#E5E5EA;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#48484A;font-size:12px;font-weight:600;aspect-ratio:1}

body{font-family:Inter,system-ui,-apple-system,sans-serif;color:#1D1D1F;-webkit-font-smoothing:antialiased}
input,select,textarea,button{font-family:Inter,system-ui,-apple-system,sans-serif}
</style>
</head>
<body>
<div style="width: 390px; height: 1560px; background: #F5F5F7; display: flex; flex-direction: column; overflow: hidden">
<header style="display: flex; align-items: center; gap: 8px; padding: 12px 8px; background: #FFFFFF; border-bottom: 1px solid #E5E5EA">
<a href="08-mobile-accueil.html" aria-label="Retour" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #1D1D1F"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
<h1 style="margin: 0; font-size: 18px; font-weight: 700; flex: 1">Rapport du jour</h1>
<span style="display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; margin-right: 8px; border-radius: 999px; background: #E8F5EC; font-size: 12px; font-weight: 600; color: #1A7F45"><span style="width: 7px; height: 7px; border-radius: 50%; background: #1A8F4C"></span>Brouillon enregistré</span>
</header>
<form style="flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 20px">
<div style="display: grid; grid-template-columns: 1.4fr 1fr; gap: 10px">
<div class="f"><label for="ch">Chantier <span class="req">*</span></label><select id="ch" class="inp"><option>Villa Almadies</option></select></div>
<div class="f"><label for="dt">Date <span class="req">*</span></label><input id="dt" class="inp" value="05/11/2026"></div>
</div>
<div class="f"><label for="tr">Travaux réalisés <span class="req">*</span></label><textarea id="tr" class="inp">Coffrage de la dalle R+1 terminé côté nord. Début du ferraillage des poteaux de façade.</textarea></div>
<fieldset style="border: 0; margin: 0; padding: 0"><legend class="lg" style="margin-bottom: 8px">Tâches du jour</legend>
<div class="box">
<label class="row"><input type="checkbox" checked="" style="width: 22px; height: 22px; accent-color: #1A8F4C"><span style="flex: 1">Réception livraison ciment</span><span style="font-size: 12px; font-weight: 600; color: #1A7F45">Terminée</span></label>
<label class="row"><input type="checkbox" checked="" style="width: 22px; height: 22px; accent-color: #1A8F4C"><span style="flex: 1">Coffrage dalle R+1</span><span style="font-size: 12px; font-weight: 600; color: #1A7F45">Terminée</span></label>
<label class="row"><input type="checkbox" style="width: 22px; height: 22px; accent-color: #1A8F4C"><span style="flex: 1">Ferraillage poteaux façade</span><span style="font-size: 12px; font-weight: 600; color: #9A5200">Non terminée</span></label>
</div>
<button type="button" style="margin-top: 8px; height: 44px; border: 0; background: transparent; color: #2B59E6; font-weight: 600; font-size: 15px; padding: 0; cursor: pointer">+ Ajouter une tâche</button>
</fieldset>
<div class="f"><label for="nb">Nombre d'ouvriers présents</label>
<div style="display: flex; align-items: center; gap: 0; width: 180px; border: 1px solid #D2D2D7; border-radius: 12px; background: #FFFFFF; overflow: hidden">
<button type="button" aria-label="Retirer un ouvrier" style="width: 56px; height: 50px; border: 0; background: #F5F5F7; font-size: 22px; font-weight: 600; cursor: pointer">−</button>
<input id="nb" inputmode="numeric" value="12" style="width: 68px; height: 50px; border: 0; text-align: center; font-size: 20px; font-weight: 700">
<button type="button" aria-label="Ajouter un ouvrier" style="width: 56px; height: 50px; border: 0; background: #F5F5F7; font-size: 22px; font-weight: 600; cursor: pointer">+</button>
</div>
<span style="font-size: 13px; color: #6E6E73">Indicatif, sans lien avec la paie.</span></div>
<div class="f"><label for="ob">Observations et difficultés</label><textarea id="ob" class="inp">Livraison de fer à béton annoncée pour demain matin. Prévoir l'accès camion côté route.</textarea></div>
<div>
<div class="lg" style="margin-bottom: 8px">Photos du chantier <span style="font-weight: 500; color: #6E6E73">(3)</span></div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<div role="img" aria-label="Photo 1 : dalle R+1" class="ph"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 16l5-5 4 4 3-3 6 6"></path></svg>Dalle R+1</div>
<div role="img" aria-label="Photo 2 : coffrage nord" class="ph"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 16l5-5 4 4 3-3 6 6"></path></svg>Coffrage</div>
<div role="img" aria-label="Photo 3 : ferraillage" class="ph"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 16l5-5 4 4 3-3 6 6"></path></svg>Ferraillage</div>
<button type="button" aria-label="Prendre une photo" style="aspect-ratio: 1; border-radius: 12px; border: 1.5px dashed #2B59E6; background: #F2F5FE; color: #2B59E6; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 600; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h4l2-3h6l2 3h4v12H3z"></path><circle cx="12" cy="13.5" r="3.5"></circle></svg>Photo</button>
</div>
<p style="margin: 8px 0 0; font-size: 13px; color: #6E6E73">Photos compressées avant envoi. Ajoutez une légende en touchant une photo.</p>
</div>
<fieldset style="border: 0; margin: 0; padding: 0"><legend class="lg" style="margin-bottom: 8px">Météo <span style="font-weight: 500; color: #6E6E73">(facultatif)</span></legend>
<div style="display: flex; flex-wrap: wrap; gap: 8px"><button type="button" class="chip on" aria-pressed="true">Ensoleillé</button><button type="button" class="chip" aria-pressed="false">Nuageux</button><button type="button" class="chip" aria-pressed="false">Pluie</button><button type="button" class="chip" aria-pressed="false">Vent fort</button></div>
</fieldset>
<div style="margin-top: auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding-top: 8px">
<button type="button" class="btn" style="border-color: #D2D2D7; background: #FFFFFF; color: #1D1D1F">Brouillon</button>
<a href="08-mobile-accueil.html" class="btn" style="background: #2B59E6; color: #FFFFFF">Publier le rapport</a>
</div>
</form>
</div>
</body>
</html>
