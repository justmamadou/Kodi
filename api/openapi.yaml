openapi: 3.0.3
info:
  title: Kodi API
  version: 1.0.0
  description: API de gestion de chantiers (Phase 1). Montants en FCFA entiers. L'organisation est déduite de la session,
    jamais de l'URL. Aligné sur les routes par TestOpenAPIMatchesRoutes.
servers:
- url: /
security:
- session: []
paths:
  /healthz:
    get:
      tags:
      - Exploitation
      summary: Vivacité du processus
      operationId: get_healthz
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                type: object
      security: []
  /readyz:
    get:
      tags:
      - Exploitation
      summary: Disponibilité (base de données joignable)
      operationId: get_readyz
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                type: object
      security: []
  /api/v1/auth/signup:
    post:
      tags:
      - Authentification
      summary: Créer une entreprise et son Owner
      operationId: post_api_v1_auth_signup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Signup'
      responses:
        '201':
          description: Succès
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Error'
      security: []
  /api/v1/auth/login:
    post:
      tags:
      - Authentification
      summary: Se connecter (erreur identique si le compte existe ou non)
      operationId: post_api_v1_auth_login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Error'
      security: []
  /api/v1/auth/invitations/{token}/accept:
    post:
      tags:
      - Authentification
      summary: Accepter une invitation (usage unique, 7 jours)
      operationId: post_api_v1_auth_invitations_token_accept
      parameters:
      - name: token
        schema:
          type: string
        required: true
        in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInvitation'
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Error'
      security: []
  /api/v1/auth/password-reset:
    post:
      tags:
      - Authentification
      summary: Demander un lien de réinitialisation (réponse identique si le compte existe ou non)
      description: Traité en arrière-plan. Si le compte est actif et a un email, un lien à usage unique,
        valable 30 minutes, est envoyé (PWA /nouveau-mot-de-passe#jeton) et remplace le précédent. 3 demandes
        par compte et par heure, en plus de la limite par adresse IP. Sans email, rien n'est envoyé (pas de
        prestataire SMS) mais la demande est tracée au journal d'audit.
      operationId: post_api_v1_auth_password_reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '202':
          description: Demande acceptée
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
        default:
          $ref: '#/components/responses/Error'
      security: []
  /api/v1/auth/password-reset/confirm:
    post:
      tags:
      - Authentification
      summary: Choisir un nouveau mot de passe avec le jeton reçu (usage unique)
      description: Révoque toutes les sessions du compte et lève son éventuel verrouillage. Jeton inconnu,
        expiré, déjà utilisé ou remplacé → 410 password_reset.invalid.
      operationId: post_api_v1_auth_password_reset_confirm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
      responses:
        '204':
          description: Mot de passe changé ; les cookies de session sont effacés
        default:
          $ref: '#/components/responses/Error'
      security: []
  /api/v1/auth/me:
    get:
      tags:
      - Authentification
      summary: Utilisateur et entreprise courants
      operationId: get_api_v1_auth_me
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Error'
  /api/v1/auth/logout:
    post:
      tags:
      - Authentification
      summary: Révoquer la session courante
      operationId: post_api_v1_auth_logout
      parameters:
      - $ref: '#/components/parameters/CSRF'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Succès
        default:
          $ref: '#/components/responses/Error'
  /api/v1/auth/sessions:
    get:
      tags:
      - Authentification
      summary: Lister ses sessions actives
      operationId: get_api_v1_auth_sessions
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Error'
  /api/v1/auth/sessions/{id}:
    delete:
      tags:
      - Authentification
      summary: Révoquer une de ses sessions
      operationId: delete_api_v1_auth_sessions_id
      parameters:
      - name: id
        schema:
          type: string
          format: uuid
        required: true
        in: path
      - $ref: '#/components/parameters/CSRF'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Succès
        default:
          $ref: '#/components/responses/Error'
  /api/v1/organization:
    get:
      tags:
      - Organisation
      summary: Lire l'entreprise
      operationId: get_api_v1_organization
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Error'
    patch:
      tags:
      - Organisation
      summary: Modifier l'entreprise (administrateur)
      operationId: patch_api_v1_organization
      parameters:
      - $ref: '#/components/parameters/CSRF'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationUpdate'
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Error'
  /api/v1/organization/settings:
    get:
      tags:
      - Organisation
      summary: Lire les paramètres
      operationId: get_api_v1_organization_settings
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Error'
    patch:
      tags:
      - Organisation
      summary: Modifier les paramètres (administrateur)
      operationId: patch_api_v1_organization_settings
      parameters:
      - $ref: '#/components/parameters/CSRF'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsUpdate'
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Error'
  /api/v1/categories:
    get:
      tags:
      - Organisation
      summary: Lister les catégories de dépenses
      operationId: get_api_v1_categories
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Error'
    post:
      tags:
      - Organisation
      summary: Créer une catégorie
      operationId: post_api_v1_categories
      parameters:
      - $ref: '#/components/parameters/CSRF'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Category'
      responses:
        '201':
          description: Succès
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Error'
  /api/v1/categories/{id}:
    patch:
      tags:
      - Organisation
      summary: Modifier une catégorie
      operationId: patch_api_v1_categories_id
      parameters:
      - name: id
        schema:
          type: string
          format: uuid
        required: true
        in: path
      - $ref: '#/components/parameters/CSRF'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Category'
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Error'
  /api/v1/suppliers:
    get:
      tags:
      - Fournisseurs
      summary: 'Répertoire des fournisseurs (500 au plus)'
      operationId: get_api_v1_suppliers
      parameters:
      - name: q
        description: Nom, raison sociale, NINEA, téléphone ou email
        schema:
          type: string
        in: query
      - name: activity
        schema:
          type: string
          enum: [materials, equipment_rental, subcontracting, transport, services, other]
        in: query
      - name: include_archived
        schema:
          type: boolean
        in: query
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Error'
    post:
      tags:
      - Fournisseurs
      summary: 'Créer un fournisseur'
      description: 'Doublons bloquants (409 supplier.duplicate, même avec confirmation) : même nom sans casse, accents, espaces ni ponctuation ; même NINEA ; même RCCM. Doublons probables (409 supplier.possible_duplicate, sauf confirm_not_duplicate) : même téléphone ou email, sur la fiche ou un contact ; nom très proche une fois la forme juridique retirée. Règles propres à chaque entreprise.'
      operationId: post_api_v1_suppliers
      parameters:
      - $ref: '#/components/parameters/CSRF'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Supplier'
      responses:
        '201':
          description: Succès
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Error'
  /api/v1/suppliers/duplicates:
    post:
      tags:
      - Fournisseurs
      summary: 'Fiches ressemblant à une saisie en cours (règles de doublon)'
      description: 'POST pour garder la saisie hors de l''URL. Chaque fiche porte ses raisons (same_name, same_ninea, same_rccm, same_phone, same_email, similar_name) et indique si elle bloque la création.'
      operationId: post_api_v1_suppliers_duplicates
      parameters:
      - $ref: '#/components/parameters/CSRF'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplierDuplicateQuery'
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Error'
  /api/v1/suppliers/{id}:
    get:
      tags:
      - Fournisseurs
      summary: 'Fiche, contacts et conditions commerciales en vigueur (selon le rôle)'
      operationId: get_api_v1_suppliers_id
      parameters:
      - name: id
        schema:
          type: string
          format: uuid
        required: true
        in: path
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Error'
    patch:
      tags:
      - Fournisseurs
      summary: 'Modifier la fiche (champ absent inchangé, chaîne vide = effacé)'
      description: 'Mêmes règles de doublon qu''à la création ; un doublon probable déjà accepté n''est redemandé que si le nom, le téléphone ou l''email changent. 409 supplier.archived sur une fiche archivée.'
      operationId: patch_api_v1_suppliers_id
      parameters:
      - name: id
        schema:
          type: string
          format: uuid
        required: true
        in: path
      - $ref: '#/components/parameters/CSRF'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Supplier'
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Error'
  /api/v1/suppliers/{id}/archive:
    post:
      tags:
      - Fournisseurs
      summary: 'Archiver : hors du répertoire et des nouvelles consultations, historique conservé'
      operationId: post_api_v1_suppliers_id_archive
      parameters:
      - name: id
        schema:
          type: string
          format: uuid
        required: true
        in: path
      - $ref: '#/components/parameters/CSRF'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Error'
  /api/v1/suppliers/{id}/restore:
    post:
      tags:
      - Fournisseurs
      summary: 'Restaurer un fournisseur archivé'
      operationId: post_api_v1_suppliers_id_restore
      parameters:
      - name: id
        schema:
          type: string
          format: uuid
        required: true
        in: path
      - $ref: '#/components/parameters/CSRF'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Error'
  /api/v1/suppliers/{id}/terms:
    get:
      tags:
      - Fournisseurs
      summary: 'Toutes les versions des conditions commerciales, la plus récente d''abord'
      operationId: get_api_v1_suppliers_id_terms
      parameters:
      - name: id
        schema:
          type: string
          format: uuid
        required: true
        in: path
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Error'
    post:
      tags:
      - Fournisseurs
      summary: 'Enregistrer de nouvelles conditions commerciales (nouvelle version, l''ancienne reste)'
      operationId: post_api_v1_suppliers_id_terms
      parameters:
      - name: id
        schema:
          type: string
          format: uuid
        required: true
        in: path
      - $ref: '#/components/parameters/CSRF'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplierTerms'
      responses:
        '201':
          description: Succès
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Error'
  /api/v1/suppliers/{id}/history:
    get:
      tags:
      - Fournisseurs
      summary: 'Consultations (demandes de prix) et achats (dépenses), sur les chantiers visibles'
      operationId: get_api_v1_suppliers_id_history
      parameters:
      - name: id
        schema:
          type: string
          format: uuid
        required: true
        in: path
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Error'
  /api/v1/suppliers/{id}/contacts:
    post:
      tags:
      - Fournisseurs
      summary: 'Ajouter un contact (un nouveau principal remplace le précédent)'
      operationId: post_api_v1_suppliers_id_contacts
      parameters:
      - name: id
        schema:
          type: string
          format: uuid
        required: true
        in: path
      - $ref: '#/components/parameters/CSRF'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplierContact'
      responses:
        '201':
          description: Succès
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Error'
  /api/v1/supplier-contacts/{id}:
    patch:
      tags:
      - Fournisseurs
      summary: 'Remplacer un contact'
      operationId: patch_api_v1_supplier_contacts_id
      parameters:
      - name: id
        schema:
          type: string
          format: uuid
        required: true
        in: path
      - $ref: '#/components/parameters/CSRF'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplierContact'
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags:
      - Fournisseurs
      summary: 'Retirer un contact'
      operationId: delete_api_v1_supplier_contacts_id
      parameters:
      - name: id
        schema:
          type: string
          format: uuid
        required: true
        in: path
      - $ref: '#/components/parameters/CSRF'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Succès
        default:
          $ref: '#/components/responses/Error'
  /api/v1/members:
    get:
      tags:
      - Membres
      summary: Lister les membres
      operationId: get_api_v1_members
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Error'
  /api/v1/members/{id}:
    patch:
      tags:
      - Membres
      summary: Attribuer un rôle, suspendre ou réactiver (audité)
      operationId: patch_api_v1_members_id
      parameters:
      - name: id
        schema:
          type: string
          format: uuid
        required: true
        in: path
      - $ref: '#/components/parameters/CSRF'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberUpdate'
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Error'
  /api/v1/invitations:
    get:
      tags:
      - Membres
      summary: Lister les invitations en attente
      operationId: get_api_v1_invitations
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Error'
    post:
      tags:
      - Membres
      summary: Inviter un collaborateur ou renvoyer son lien
      operationId: post_api_v1_invitations
      parameters:
      - $ref: '#/components/parameters/CSRF'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Invite'
      responses:
        '201':
          description: Succès
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Error'
  /api/v1/invitations/{id}:
    delete:
      tags:
      - Membres
      summary: Révoquer une invitation
      operationId: delete_api_v1_invitations_id
      parameters:
      - name: id
        schema:
          type: string
          format: uuid
        required: true
        in: path
      - $ref: '#/components/parameters/CSRF'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Succès
        default:
          $ref: '#/components/responses/Error'
  /api/v1/audit-logs:
    get:
      tags:
      - Membres
      summary: Lire le journal d'audit
      operationId: get_api_v1_audit_logs
      parameters:
      - name: action
        schema:
          type: string
        in: query
      - name: entity_id
        schema:
          type: string
          format: uuid
        in: query
      - name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
        in: query
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Error'
  /api/v1/projects:
    get:
      tags:
      - Chantiers
      summary: Lister les chantiers visibles
      operationId: get_api_v1_projects
      parameters:
      - name: status
        schema:
          type: string
        in: query
      - name: manager_id
        schema:
          type: string
          format: uuid
        in: query
      - name: q
        schema:
          type: string
        in: query
      - name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
        in: query
      - name: cursor
        schema:
          type: string
        in: query
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Error'
    post:
      tags:
      - Chantiers
      summary: Créer un chantier
      operationId: post_api_v1_projects
      parameters:
      - $ref: '#/components/parameters/CSRF'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
      responses:
        '201':
          description: Succès
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Error'
  /api/v1/projects/{id}:
    get:
      tags:
      - Chantiers
      summary: Lire un chantier
      operationId: get_api_v1_projects_id
      parameters:
      - name: id
        schema:
          type: string
          format: uuid
        required: true
        in: path
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Error'
    patch:
      tags:
      - Chantiers
      summary: Modifier un chantier (If-Match requis)
      operationId: patch_api_v1_projects_id
      parameters:
      - name: id
        schema:
          type: string
          format: uuid
        required: true
        in: path
      - name: If-Match
        description: row_version lue
        schema:
          type: integer
        required: true
        in: header
      - $ref: '#/components/parameters/CSRF'
      - $ref: '#/components/parameters/IdempotencyKey'
