          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Error'
  /api/v1/supplier/rfq:
    post:
      tags:
      - Fournisseurs consultés
      summary: 'Fournisseur : voir la demande et ses propres offres'
      description: 'Sans session : le jeton du lien circule dans le corps, jamais dans l''URL. Lien inconnu ou renouvelé → 410 rfq_link.invalid.'
      operationId: post_api_v1_supplier_rfq
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RFQLinkToken'
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Error'
      security: []
  /api/v1/supplier/offers:
    post:
      tags:
      - Fournisseurs consultés
      summary: 'Fournisseur : déposer une offre (nouvelle version à chaque envoi)'
      description: 'Acceptée tant que la demande est publiée et que la date limite (incluse, heure de Dakar) n''est pas passée, sinon 409 rfq.not_open. Avec un id déjà enregistré, retourne l''offre existante (200).'
      operationId: post_api_v1_supplier_offers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfferSubmit'
      responses:
        '201':
          description: Succès
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Error'
      security: []
  /api/v1/rfqs/{id}/criteria:
    put:
      tags:
      - Demandes de prix
      summary: 'Pondérer les critères de comparaison (prix, délai, couverture ; total 100)'
      description: 'Le détail d''une demande (GET /rfqs/{id}) porte l''évaluation : score de chaque dernière offre sur ces critères, et rang. 409 rfq.already_awarded une fois une offre retenue.'
      operationId: put_api_v1_rfqs_id_criteria
      parameters:
      - name: id
        schema:
          type: string
          format: uuid
        required: true
        in: path
      - $ref: '#/components/parameters/CSRF'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RFQCriteria'
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Error'
  /api/v1/rfqs/{id}/award:
    post:
      tags:
      - Demandes de prix
      summary: 'Retenir une offre (consultation close, dernière version du fournisseur)'
      operationId: post_api_v1_rfqs_id_award
      parameters:
      - name: id
        schema:
          type: string
          format: uuid
        required: true
        in: path
      - $ref: '#/components/parameters/CSRF'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RFQAward'
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags:
      - Demandes de prix
      summary: 'Retirer la sélection (impossible si une commande active en découle)'
      operationId: delete_api_v1_rfqs_id_award
      parameters:
      - name: id
        schema:
          type: string
          format: uuid
        required: true
        in: path
      - $ref: '#/components/parameters/CSRF'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Error'
  /api/v1/rfqs/{id}/purchase-order:
    post:
      tags:
      - Bons de commande
      summary: 'Générer le bon de commande en brouillon depuis l''offre retenue (numéroté BC-0001...)'
      operationId: post_api_v1_rfqs_id_purchase_order
      parameters:
      - name: id
        schema:
          type: string
          format: uuid
        required: true
        in: path
      - $ref: '#/components/parameters/CSRF'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Succès
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Error'
  /api/v1/purchase-orders:
    get:
      tags:
      - Bons de commande
      summary: 'Lister les commandes des chantiers visibles (montant masqué au chef de chantier)'
      operationId: get_api_v1_purchase_orders
      parameters:
      - name: project_id
        schema:
          type: string
          format: uuid
        in: query
      - name: supplier_id
        schema:
          type: string
          format: uuid
        in: query
      - name: status
        schema:
          type: string
          enum: [draft, submitted, approved, sent, partially_received, received, cancelled]
        in: query
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Error'
  /api/v1/purchase-orders/{id}:
    get:
      tags:
      - Bons de commande
      summary: 'Commande : lignes (commandé, reçu, restant), réceptions, historique'
      description: 'Les prix et l''historique détaillé ne sont renvoyés qu''aux rôles qui voient les prix (prices_visible).'
      operationId: get_api_v1_purchase_orders_id
      parameters:
      - name: id
        schema:
          type: string
          format: uuid
        required: true
        in: path
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Error'
    put:
      tags:
      - Bons de commande
      summary: 'Remplacer le contenu d''un brouillon (lignes, taxes, délais, conditions)'
      description: 'Une ligne rattachée au catalogue (material_id) garde l''unité de l''article : elle peut alors entrer en stock. Totaux HT, taxes et TTC recalculés par la base.'
      operationId: put_api_v1_purchase_orders_id
      parameters:
      - name: id
        schema:
          type: string
          format: uuid
        required: true
        in: path
      - $ref: '#/components/parameters/CSRF'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseOrderDraft'
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Error'
  /api/v1/purchase-orders/{id}/submit:
    post:
      tags:
      - Bons de commande
      summary: 'Soumettre à l''approbation (brouillon → soumise)'
      operationId: post_api_v1_purchase_orders_id_submit
      parameters:
      - name: id
        schema:
          type: string
          format: uuid
        required: true
        in: path
      - $ref: '#/components/parameters/CSRF'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Error'
  /api/v1/purchase-orders/{id}/approve:
    post:
      tags:
      - Bons de commande
      summary: 'Approuver (soumise → approuvée), jamais par l''auteur de la commande'
      operationId: post_api_v1_purchase_orders_id_approve
      parameters:
      - name: id
        schema:
          type: string
          format: uuid
        required: true
        in: path
      - $ref: '#/components/parameters/CSRF'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Comment'
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Error'
  /api/v1/purchase-orders/{id}/return:
    post:
      tags:
      - Bons de commande
      summary: 'Renvoyer en brouillon, avec motif (soumise → brouillon)'
      operationId: post_api_v1_purchase_orders_id_return
      parameters:
      - name: id
        schema:
          type: string
          format: uuid
        required: true
        in: path
      - $ref: '#/components/parameters/CSRF'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Comment'
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Error'
  /api/v1/purchase-orders/{id}/send:
    post:
      tags:
      - Bons de commande
      summary: 'Envoyer au fournisseur (approuvée → envoyée), par email s''il en a un'
      operationId: post_api_v1_purchase_orders_id_send
      parameters:
      - name: id
        schema:
          type: string
          format: uuid
        required: true
        in: path
      - $ref: '#/components/parameters/CSRF'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Error'
  /api/v1/purchase-orders/{id}/cancel:
    post:
      tags:
      - Bons de commande
      summary: 'Annuler, avec motif, tant que rien n''est reçu'
      operationId: post_api_v1_purchase_orders_id_cancel
      parameters:
      - name: id
        schema:
          type: string
          format: uuid
        required: true
        in: path
      - $ref: '#/components/parameters/CSRF'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Comment'
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Error'
  /api/v1/purchase-orders/{id}/receipts:
    post:
      tags:
      - Bons de commande
      summary: 'Enregistrer une réception, partielle ou complète'
      description: 'Commande envoyée ou partiellement reçue. Quantités jamais au-delà du restant (422 receipt.over_quantity). Un même identifiant renvoyé retourne la réception existante (200) ; un même bon de livraison sur la commande est refusé (409 receipt.duplicate). to_stock : les lignes rattachées au catalogue entrent en stock sur le chantier, par un mouvement posté.'
      operationId: post_api_v1_purchase_orders_id_receipts
      parameters:
      - name: id
        schema:
          type: string
          format: uuid
        required: true
        in: path
      - $ref: '#/components/parameters/CSRF'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Receipt'
      responses:
        '201':
          description: Succès
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    session:
      type: apiKey
      name: cf_session
      in: cookie
  parameters:
    CSRF:
      name: X-CSRF-Token
      description: Copie du cookie cf_csrf
      schema:
        type: string
      required: true
      in: header
    IdempotencyKey:
      name: Idempotency-Key
      description: 'UUID client : un rejeu retourne la réponse mémorisée'
      schema:
        type: string
        format: uuid
      in: header
  responses:
    Error:
      description: Erreur
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      description: Erreur RFC 9457
      required:
      - status
      - code
      - detail
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          example: expense.not_pending
        detail:
          type: string
          description: Message en français, affichable
        fields:
          type: object
          nullable: true
          additionalProperties:
            type: string
          description: Erreurs par champ de formulaire
        request_id:
          type: string
    Signup:
      type: object
      additionalProperties: false
      properties:
        organization_name:
          type: string
        slug:
          type: string
        full_name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
          example: '+221771234567'
        password:
          type: string
          minLength: 10
        remember:
          type: boolean
        company_phone:
          type: string
        activity_type:
          type: string
          enum:
          - villas
          - gros_oeuvre
          - second_oeuvre
          - renovation
          - general
        city:
          type: string
        address:
          type: string
      required:
      - organization_name
      - full_name
      - password
    Login:
      type: object
      additionalProperties: false
      properties:
        login:
          type: string
          description: Email ou téléphone
        password:
          type: string
        remember:
          type: boolean
      required:
      - login
      - password
    AcceptInvitation:
      type: object
      additionalProperties: false
      properties:
        password:
          type: string
          minLength: 10
        full_name:
          type: string
      required:
      - password
    PasswordResetRequest:
      type: object
      additionalProperties: false
      properties:
        login:
          type: string
          description: Email ou téléphone
      required:
      - login
    PasswordResetConfirm:
      type: object
      additionalProperties: false
      properties:
        token:
          type: string
          description: Jeton reçu dans le lien
        password:
          type: string
          minLength: 10
      required:
      - token
      - password
    OrganizationUpdate:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        slug:
          type: string
        legal_name:
          type: string
        phone:
          type: string
        email:
          type: string
        address:
          type: string
        city:
          type: string
        activity_type:
          type: string
          enum:
          - villas
          - gros_oeuvre
          - second_oeuvre
          - renovation
          - general
    SettingsUpdate:
      type: object
      additionalProperties: false
      properties:
        budget_alert_thresholds:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 200
      required:
      - budget_alert_thresholds
    Category:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        is_active:
          type: boolean
        sort_order:
          type: integer
    Supplier:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 160
        phone:
          type: string
          description: Normalisé au format international (77 123 45 67 → +221771234567)
        email:
          type: string
          format: email
          description: Les liens de demande de prix y sont envoyés
        legal_name:
          type: string
          description: Raison sociale
        legal_form:
          type: string
          enum: [ei, suarl, sarl, sa, sas, gie, other]
        ninea:
          type: string
          example: 004567891 2G3
        rccm:
          type: string
          example: SN-DKR-2015-B-12345
        address:
          type: string
        city:
          type: string
        activities:
          type: array
          items:
            type: string
            enum: [materials, equipment_rental, subcontracting, transport, services, other]
        notes:
          type: string
        confirm_not_duplicate:
          type: boolean
          description: Passe outre un doublon probable, jamais un doublon bloquant
    SupplierDuplicateQuery:
      allOf:
      - $ref: '#/components/schemas/Supplier'
      - type: object
        properties:
          exclude_id:
            type: string
            format: uuid
    SupplierContact:
      type: object
      additionalProperties: false
      properties:
        full_name:
          type: string
        job_title:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        is_primary:
          type: boolean
        notes:
          type: string
      required:
      - full_name
      description: Un téléphone ou un email est obligatoire
    SupplierTerms:
      type: object
      additionalProperties: false
      description: Au moins une condition. Les versions passées ne changent jamais.
      properties:
        effective_from:
          type: string
          format: date
          description: Par défaut aujourd'hui
        payment_method:
          type: string
          enum: [cash, wave, orange_money, free_money, bank_transfer, cheque, other]
        payment_delay_days:
          type: integer
          minimum: 0
          maximum: 365
        advance_pct:
          type: integer
          minimum: 0
          maximum: 100
        discount_pct:
          type: string
          example: '2.5'
        delivery_days:
          type: integer
          minimum: 0
          maximum: 365
        delivery_included:
          type: boolean
        minimum_order_amount:
          type: integer
          format: int64
          description: FCFA
        credit_limit:
          type: integer
          format: int64
          description: Encours autorisé, FCFA
        notes:
          type: string
    RFQ:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 2
          maxLength: 160
        notes:
          type: string
          maxLength: 4000
        response_deadline:
          type: string
          format: date
          description: Date limite de réponse, incluse (heure de Dakar) ; obligatoire pour publier
        delivery_date:
          type: string
          format: date
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/RFQItem'
        supplier_ids:
          type: array
          maxItems: 50
          items:
            type: string
            format: uuid
      required:
      - title
    RFQItem:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [material, service]
        material_id:
          type: string
          format: uuid
          description: Article du catalogue (matériau seulement)
        label:
          type: string
          minLength: 2
          maxLength: 200
        quantity:
          type: string
          example: '12.5'
          description: Décimal positif, 3 décimales au plus
        unit:
          type: string
          enum: [sac, barre, m3, m2, ml, unite, kg, tonne, litre, rouleau, boite, forfait, jour, heure]
        specifications:
          type: string
          maxLength: 2000
        needed_by:
          type: string
          format: date
      required:
      - kind
      - label
      - quantity
      - unit
    RFQCancel:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          maxLength: 500
      required:
      - reason
    RFQLinkToken:
      type: object
      additionalProperties: false
      properties:
        token:
          type: string
          description: Jeton du lien reçu (partie après /offre#)
      required:
      - token
    OfferSubmit:
      type: object
      additionalProperties: false
      properties:
        token:
          type: string
        id:
          type: string
          format: uuid
          description: Généré par la page pour qu'un double envoi n'ait qu'un effet
        lines:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            properties:
              rfq_item_id:
                type: string
                format: uuid
              unit_price:
                type: integer
                format: int64
                minimum: 0
                description: FCFA, entier
              comment:
                type: string
                maxLength: 500
            required:
            - rfq_item_id
            - unit_price
        valid_until:
          type: string
          format: date
        delivery_days:
          type: integer
          minimum: 0
          maximum: 365
        payment_terms:
          type: string
          maxLength: 500
        notes:
          type: string
          maxLength: 2000
        contact_name:
          type: string
          maxLength: 160
      required:
      - token
      - lines
    RFQCriteria:
      type: object
      additionalProperties: false
      properties:
        weight_price:
          type: integer
          minimum: 0
          maximum: 100
        weight_delivery:
          type: integer
          minimum: 0
          maximum: 100
        weight_coverage:
          type: integer
          minimum: 0
          maximum: 100
      required: [weight_price, weight_delivery, weight_coverage]
    RFQAward:
      type: object
      additionalProperties: false
      properties:
        offer_id:
          type: string
          format: uuid
        reason:
          type: string
          maxLength: 1000
      required: [offer_id]
    Comment:
      type: object
      additionalProperties: false
      properties:
        comment:
          type: string
          maxLength: 1000
    PurchaseOrderDraft:
      type: object
      additionalProperties: false
      properties:
        expected_delivery_date:
          type: string
          format: date
        delivery_address:
          type: string
        payment_terms:
          type: string
        notes:
          type: string
        lines:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            properties:
              rfq_item_id:
                type: string
                format: uuid
              material_id:
                type: string
                format: uuid
              label:
                type: string
              unit:
                type: string
              quantity:
                type: string
                example: '100'
              unit_price:
                type: integer
                format: int64
              tax_rate:
                type: string
                example: '18'
              comment:
                type: string
            required: [label, unit, quantity, unit_price, tax_rate]
      required: [lines]
    Receipt:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: Généré par l'appareil, pour qu'un renvoi n'ait qu'un effet
        received_on:
          type: string
          format: date
        delivery_note_ref:
          type: string
          maxLength: 60
          description: Numéro du bon de livraison, unique par commande
        notes:
          type: string
        to_stock:
          type: boolean
        lines:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            properties:
              line_id:
                type: string
                format: uuid
              quantity:
                type: string
                example: '40'
            required: [line_id, quantity]
      required: [received_on, lines]
    Invite:
      type: object
      additionalProperties: false
      properties:
        full_name:
          type: string
        email:
          type: string
        phone:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        project_ids:
          type: array
          items:
            type: string
            format: uuid
          description: Appliqués à l'acceptation
      required:
      - full_name
      - role
    Role:
      type: string
      enum:
      - owner
      - manager
      - accountant
      - site_worker
      - viewer
    MemberUpdate:
      type: object
      additionalProperties: false
      properties:
        role:
          $ref: '#/components/schemas/Role'
        status:
          type: string
          enum:
          - active
          - suspended
    ProjectCreate:
      type: object
      additionalProperties: false
      properties:
        reference:
          type: string
        name:
          type: string
        client_name:
          type: string
        address:
